<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Jeoparty! Admin</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Della+Respira&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=4">
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html" title="Back to the game"><img src="assets/logo.png" alt="Jeoparty!"><span>Admin</span></a>
    <div class="topRight">
      <button id="connBtn" class="chip"></button>
      <a class="btn ghost" href="index.html" target="_blank" rel="noopener">Play ↗</a>
      <button id="saveBtn" class="btn gold">Save changes</button>
    </div>
  </header>
  <div id="status" class="status" hidden></div>
  <main class="layout">
    <aside class="side">
      <h2>Game boards</h2>
      <div id="gameList" class="gameList"></div>
      <button id="newGameBtn" class="btn ghost full">+ New game</button>
      <label class="btn ghost full fileBtn">Import from backup…<input id="importInput" type="file" accept="application/json,.json" hidden></label>
    </aside>
    <section id="editor" class="editor"></section>
  </main>
  <div id="modalRoot"></div>
  <script src="js/common.js?v=4"></script>
  <script src="js/sheet.js?v=4"></script>
  <script src="js/admin.js?v=4"></script>
</body>
</html>
